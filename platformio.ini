; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
; platform = espressif32@6.13.0 ; Arduino Release V2.0.17
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip#55.03.38-1 ; Arduino Release v3.3.8 based on ESP-IDF v5.5.4
board = atd35-s3
framework = arduino
board_build.partitions = 8m_ota_app.csv
upload_speed = 921600
monitor_speed = 115200
build_flags = 
  -I./include
  ; -Ilib/lvgl/demos
  ; -Ilib
  ; -DLV_LVGL_H_INCLUDE_SIMPLE
  -DCORE_DEBUG_LEVEL=5
  ; usb_host_uvc (lib/usb_host_uvc) Kconfig values
  ; esp_new_jpeg prebuilt static lib (fast JPEG decoder for ESP32-S3)
  -L$PROJECT_DIR/lib/esp_new_jpeg
  -lesp_new_jpeg
  -DCONFIG_UVC_INTERVAL_ARRAY_SIZE=3
  -DCONFIG_UVC_CHECK_PAYLOAD_HEADER_EOH=1
  -DCONFIG_UVC_CHECK_PAYLOAD_HEADER_ERR=1
build_src_filter =
  +<*>
  ; Force compile LVGL demo, remove when working on your own project
  ; +<C:\Users\sonth\GitHub\ATD3.5-S3-Template-PIO\lib\lvgl\demos>
monitor_filters = esp32_exception_decoder
; UVC cameras have a long configuration descriptor (> default 256 B).
; This makes pioarduino rebuild the ESP-IDF libs (Hybrid Compile) with a larger buffer.
custom_sdkconfig =
  CONFIG_USB_HOST_CONTROL_TRANSFER_MAX_SIZE=4096
